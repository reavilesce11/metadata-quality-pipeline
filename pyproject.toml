[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metadata-quality-pipeline"
version = "0.1.0"
description = "Reproducible metadata validation and episode matching pipeline using synthetic data."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Renato Aviles" }]
license = { text = "MIT" }

[project.scripts]
metadata-quality = "metadata_quality.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

